<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚶 동네 산책 코스 추천</title>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>

    background: #f0f4f0;

    color: white;
    padding: 20px 24px;
    text-align: center;

  .header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

<body>

<div class="header">
  <h1>🚶 동네 산책 코스 추천</h1>

<div class="container">
  <div class="weather-card" id="weatherCard" style="display:none">

      <button class="pref-chip" data-value="exercise">운동</button>

  </div>

  <div class="courses-section" id="coursesSection" style="display:none">
    <div class="courses-title">📋 추천 코스</div>
    <div id="coursesList"></div>
  </div>

  <div class="footer">
    🌿 동네 산책 코스 추천 v1.0 — 지리교육 × AI 프로젝트

</div>

<script>
// ===== 상태 관리 =====
let currentLat = null;
let currentLng = null;
let currentLocationName = '';
let map = null;
let routeLayer = null;
let selectedTime = 30;
let selectedPurpose = 'relax';

// ===== 칩 선택 =====
document.querySelectorAll('#timeChips .pref-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#timeChips .pref-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedTime = parseInt(chip.dataset.value);
  });
});
document.querySelectorAll('#purposeChips .pref-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#purposeChips .pref-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedPurpose = chip.dataset.value;
  });
});

// ===== OSRM 도로 기반 경로 가져오기 =====
// OSRM 무료 서버를 사용해서 실제 도보 경로를 가져옵니다
async function getWalkingRoute(waypoints) {
  // waypoints: [[lat, lng], [lat, lng], ...]
  // OSRM은 lng,lat 순서를 사용합니다
  const coords = waypoints.map(p => `${p[1]},${p[0]}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/foot/${coords}?overview=full&geometries=geojson&steps=true`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.code === 'Ok' && data.routes.length > 0) {
      const route = data.routes[0];
      // GeoJSON 좌표는 [lng, lat] 순서 → [lat, lng]로 변환
      const path = route.geometry.coordinates.map(c => [c[1], c[0]]);
      const distanceKm = (route.distance / 1000).toFixed(1);
      const durationMin = Math.round(route.duration / 60);
      return { path, distanceKm: parseFloat(distanceKm), durationMin };
    }
  } catch (e) {
    console.error('OSRM 라우팅 오류:', e);
  }
  return null;
}

// ===== 경유지 생성 (원형/랜덤 패턴) =====
// 출발지 주변으로 실제 도로 위의 경유지를 생성합니다
function generateWaypoints(lat, lng, radiusKm, numPoints, pattern) {
  const waypoints = [[lat, lng]]; // 출발점

  // 1km ≈ 위도 0.009, 경도 0.011 (한국 기준 대략적)
  const latPerKm = 0.009;
  const lngPerKm = 0.011;

  if (pattern === 'loop') {
    // 순환 코스: 원형으로 경유지 배치
    for (let i = 0; i < numPoints; i++) {
      const angle = (2 * Math.PI * i) / numPoints - Math.PI / 2;
      const jitterLat = (Math.random() - 0.5) * radiusKm * 0.3 * latPerKm;
      const jitterLng = (Math.random() - 0.5) * radiusKm * 0.3 * lngPerKm;
      waypoints.push([
        lat + Math.sin(angle) * radiusKm * latPerKm + jitterLat,
        lng + Math.cos(angle) * radiusKm * lngPerKm + jitterLng
      ]);
    }
    waypoints.push([lat, lng]); // 출발점으로 복귀
  } else if (pattern === 'outAndBack') {
    // 왕복 코스: 한 방향으로 갔다가 돌아오기
    const angle = Math.random() * 2 * Math.PI;
    for (let i = 1; i <= numPoints; i++) {
      const ratio = i / numPoints;
      const jitterLat = (Math.random() - 0.5) * radiusKm * 0.2 * latPerKm;
      const jitterLng = (Math.random() - 0.5) * radiusKm * 0.2 * lngPerKm;
      waypoints.push([
        lat + Math.sin(angle) * radiusKm * ratio * latPerKm + jitterLat,
        lng + Math.cos(angle) * radiusKm * ratio * lngPerKm + jitterLng
      ]);
    }
    // 돌아오는 길 (약간 다른 경로)
    const returnAngle = angle + (Math.random() * 0.5 - 0.25);
    for (let i = numPoints - 1; i >= 1; i--) {
      const ratio = i / numPoints;
      const jitterLat = (Math.random() - 0.5) * radiusKm * 0.3 * latPerKm;
      const jitterLng = (Math.random() - 0.5) * radiusKm * 0.3 * lngPerKm;
      waypoints.push([
        lat + Math.sin(returnAngle) * radiusKm * ratio * latPerKm + jitterLat,
        lng + Math.cos(returnAngle) * radiusKm * ratio * lngPerKm + jitterLng
      ]);
    }
    waypoints.push([lat, lng]);
  } else {
    // 탐험 코스: 랜덤하게 돌아다니기
    for (let i = 0; i < numPoints; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const dist = (0.3 + Math.random() * 0.7) * radiusKm;
      waypoints.push([
        lat + Math.sin(angle) * dist * latPerKm,
        lng + Math.cos(angle) * dist * lngPerKm
      ]);
    }
    waypoints.push([lat, lng]);
  }

  return waypoints;
}

// ===== 위치 검색 =====
async function searchLocation() {
  const query = document.getElementById('locationInput').value.trim();
  if (!query) return alert('장소를 입력해주세요!');

  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=kr&limit=1`);
    const data = await res.json();
    if (data.length === 0) {
      alert('장소를 찾을 수 없어요. 다른 이름으로 검색해보세요!');
      return;
    }
    currentLat = parseFloat(data[0].lat);
    currentLng = parseFloat(data[0].lon);
    currentLocationName = query;
    updateWeather();
  } catch (e) {
    alert('검색 중 오류가 발생했어요. 다시 시도해주세요!');
  }
}

// ===== GPS =====
function getMyLocation() {
  if (!navigator.geolocation) { alert('이 브라우저에서는 GPS를 사용할 수 없어요.'); return; }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}`);
        const data = await res.json();
        const addr = data.address;
        currentLocationName = addr.borough || addr.suburb || addr.neighbourhood || addr.city || '내 위치';
        document.getElementById('locationInput').value = currentLocationName;
      } catch (e) { currentLocationName = '내 위치'; }
      updateWeather();
    },
    () => alert('위치 접근을 허용해주세요!')
  );
}

document.getElementById('locationInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchLocation();
});

// ===== 날씨 시뮬레이션 =====
function getSimulatedWeather() {
  const hour = new Date().getHours();
  const month = new Date().getMonth() + 1;

  let baseTemp;
  if (month >= 3 && month <= 5) baseTemp = 14 + Math.random() * 8;
  else if (month >= 6 && month <= 8) baseTemp = 25 + Math.random() * 8;
  else if (month >= 9 && month <= 11) baseTemp = 10 + Math.random() * 10;
  else baseTemp = -3 + Math.random() * 8;

  if (hour < 7 || hour > 20) baseTemp -= 3;
  if (hour >= 12 && hour <= 15) baseTemp += 2;

  const temp = Math.round(baseTemp);
  const humidity = 40 + Math.round(Math.random() * 40);
  const uvIndex = (hour >= 10 && hour <= 16) ? Math.round(Math.random() * 8 + 2) : Math.round(Math.random() * 3);
  const weathers = [
    { icon: '☀️', desc: '맑음', code: 'clear' },
    { icon: '⛅', desc: '구름 조금', code: 'partly_cloudy' },
    { icon: '☁️', desc: '흐림', code: 'cloudy' },
    { icon: '🌧️', desc: '가벼운 비', code: 'rain' },
    { icon: '🌤️', desc: '대체로 맑음', code: 'mostly_clear' },
  ];
  const w = weathers[Math.floor(Math.random() * weathers.length)];
  const windSpeed = Math.round(Math.random() * 15 + 2);
  const pm25 = Math.round(Math.random() * 80 + 10);
  return { temp, humidity, uvIndex, windSpeed, pm25, ...w };
}

function updateWeather() {
  const weather = getSimulatedWeather();
  window.currentWeather = weather;

  document.getElementById('weatherCard').style.display = 'flex';
  document.getElementById('weatherIcon').textContent = weather.icon;
  document.getElementById('weatherLocation').textContent = currentLocationName;
  document.getElementById('weatherTemp').textContent = `${weather.temp}°`;
  document.getElementById('weatherDesc').textContent = weather.desc;

  const tags = [];
  tags.push(`습도 ${weather.humidity}%`);
  tags.push(`바람 ${weather.windSpeed}m/s`);
  tags.push(`자외선 ${weather.uvIndex}`);
  tags.push(`미세먼지 ${weather.pm25 < 30 ? '좋음' : weather.pm25 < 50 ? '보통' : '나쁨'}`);
  document.getElementById('weatherTags').innerHTML = tags.map(t => `<span class="weather-tag">${t}</span>`).join('');
}

// ===== 코스 정의 =====
function getCourseTemplates() {
  return [
    {
      name: `${currentLocationName} 공원 순환 코스`,
      desc: '동네 공원과 녹지를 돌아보는 순환 코스. 평탄한 길이라 부담 없어요.',
      difficulty: 'easy', radiusKm: 0.4, numPoints: 4, pattern: 'loop',
      purpose: ['relax', 'photo'], allWeather: false,
      reason: '평탄한 순환 코스로 가벼운 산책에 딱이에요.',
      baseTime: 20, baseDist: 1.5, baseCal: 80
    },
    {
      name: `${currentLocationName} 하천길 코스`,
      desc: '하천을 따라 걷는 편안한 산책로. 물소리를 들으며 힐링할 수 있어요.',
      difficulty: 'easy', radiusKm: 0.6, numPoints: 3, pattern: 'outAndBack',
      purpose: ['relax', 'exercise'], allWeather: false,
      reason: '하천변은 바람이 시원하고 자연을 느끼기 좋아요.',
      baseTime: 35, baseDist: 2.5, baseCal: 120
    },
    {
      name: `${currentLocationName} 골목 탐험`,
      desc: '좁은 골목과 벽화, 작은 가게들을 구경하며 걷는 코스. 사진 찍기 좋은 포인트가 많아요.',
      difficulty: 'easy', radiusKm: 0.3, numPoints: 5, pattern: 'explore',
      purpose: ['photo', 'cafe'], allWeather: true,
      reason: '건물 사이 그늘이 많아 날씨 영향을 덜 받아요.',
      baseTime: 30, baseDist: 1.8, baseCal: 90

// ===== 코스 생성 =====
async function generateCourses() {
  if (!currentLat || !currentLng) {
    alert('먼저 위치를 검색하거나 GPS로 설정해주세요!');
    return;
  }

  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');
  const coursesSection = document.getElementById('coursesSection');
  const aiMessage = document.getElementById('aiMessage');

  loading.classList.add('show');
  coursesSection.style.display = 'none';
  aiMessage.style.display = 'none';
  document.getElementById('generateBtn').disabled = true;

  const weather = window.currentWeather;
  const templates = getCourseTemplates();

  // 점수 매기기
  const scored = templates.map(course => {
    let score = 0;
    if (course.purpose.includes(selectedPurpose)) score += 30;
    const timeDiff = Math.abs(course.baseTime - selectedTime);
    score += Math.max(0, 25 - timeDiff);
    if (weather.code === 'rain' && course.allWeather) score += 20;
    if (weather.code === 'rain' && !course.allWeather) score -= 15;
    if (weather.temp > 30 && course.allWeather) score += 10;
    if (weather.temp < 5 && course.allWeather) score += 10;
    if (weather.pm25 >= 50 && course.baseTime <= 30) score += 10;
    if (weather.pm25 >= 50 && course.baseTime > 45) score -= 10;
    score += Math.random() * 10;
    return { ...course, score };
  });

  scored.sort((a, b) => b.score - a.score);
  const topCourses = scored.slice(0, 3);

  // OSRM으로 실제 도로 경로 가져오기
  loadingText.textContent = '실제 도로 경로를 계산하고 있어요...';

  const coursesWithRoutes = [];
  for (let i = 0; i < topCourses.length; i++) {
    const course = topCourses[i];
    loadingText.textContent = `코스 ${i + 1}/3 경로를 계산 중...`;

    // 경유지 생성
    const waypoints = generateWaypoints(currentLat, currentLng, course.radiusKm, course.numPoints, course.pattern);

    // OSRM에서 실제 도로 경로 가져오기
    const routeData = await getWalkingRoute(waypoints);

    if (routeData) {
      coursesWithRoutes.push({
        ...course,
        routePath: routeData.path,
        distKm: routeData.distanceKm,
        timeMin: routeData.durationMin,
        calories: Math.round(routeData.distanceKm * 65), // 대략 km당 65kcal
        waypoints: waypoints
      });
    } else {
      // OSRM 실패시 기본값 사용
      coursesWithRoutes.push({
        ...course,
        routePath: waypoints,
        distKm: course.baseDist,
        timeMin: course.baseTime,
        calories: course.baseCal,
        waypoints: waypoints,
        fallback: true
      });
    }
  }

  loading.classList.remove('show');
  document.getElementById('generateBtn').disabled = false;

  // AI 메시지
  let msg = `<strong>🤖 AI 분석 결과</strong><br>`;
  msg += `현재 ${currentLocationName}은(는) ${weather.desc}, ${weather.temp}°C 입니다. `;
  if (weather.code === 'rain') msg += `비가 오고 있어서 실내 경유 코스 위주로 추천했어요. `;
  else if (weather.temp > 30) msg += `더운 날씨라 그늘이 많은 코스를 우선 추천했어요. `;
  else if (weather.temp < 5) msg += `추운 날씨라 따뜻한 카페를 경유하는 코스를 포함했어요. `;
  else msg += `산책하기 좋은 날씨네요! `;

  if (weather.pm25 >= 50) msg += `미세먼지가 높으니 마스크를 착용하시고, 짧은 코스를 권장해요.`;
  else if (weather.uvIndex >= 6) msg += `자외선이 강하니 모자나 선크림을 챙기세요!`;
  else msg += `실제 도로를 기반으로 경로를 계산했어요. 🌿`;

  aiMessage.innerHTML = msg;
  aiMessage.style.display = 'block';
  aiMessage.classList.add('fade-in');

  showMap();
  renderCourses(coursesWithRoutes);
}

// ===== 지도 =====
function showMap() {
  const container = document.getElementById('mapContainer');
  container.style.display = 'block';

  if (!map) {
    map = L.map('map').setView([currentLat, currentLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
  } else {
    map.setView([currentLat, currentLng], 15);
  }

  if (routeLayer) map.removeLayer(routeLayer);
  routeLayer = L.layerGroup().addTo(map);

  L.marker([currentLat, currentLng])
    .addTo(routeLayer)
    .bindPopup(`📍 ${currentLocationName}`)
    .openPopup();
}

function showCourseOnMap(course, index) {
  if (!map || !routeLayer) return;
  routeLayer.clearLayers();

  const colors = ['#00b894', '#0984e3', '#e17055'];
  const color = colors[index] || '#00b894';

  // 출발 마커
  L.marker([currentLat, currentLng])
    .addTo(routeLayer)
    .bindPopup(`📍 출발/도착: ${currentLocationName}`);

  // 실제 도로 경로 표시
  if (course.routePath && course.routePath.length > 1) {
    L.polyline(course.routePath, {
      color: color,
      weight: 5,
      opacity: 0.8,
      lineJoin: 'round'
    }).addTo(routeLayer);

    // 경유지 마커 표시
    if (course.waypoints) {
      course.waypoints.forEach((point, i) => {
        if (i === 0 || i === course.waypoints.length - 1) return; // 출발/도착 제외
        L.circleMarker(point, {
          radius: 7,
          fillColor: color,
          color: 'white',
          weight: 2,
          fillOpacity: 0.9
        }).addTo(routeLayer).bindPopup(`📌 경유지 ${i}`);
      });
    }

    map.fitBounds(course.routePath, { padding: [40, 40] });
  }
}

// ===== 코스 카드 =====
function renderCourses(courses) {
  const section = document.getElementById('coursesSection');
  const list = document.getElementById('coursesList');
  section.style.display = 'block';
  list.innerHTML = '';

  courses.forEach((course, index) => {
    const card = document.createElement('div');
    card.className = 'course-card fade-in';
    card.style.animationDelay = `${index * 0.15}s`;

    const badgeClass = course.difficulty === 'easy' ? 'badge-easy' : course.difficulty === 'medium' ? 'badge-medium' : 'badge-hard';
    const badgeText = course.difficulty === 'easy' ? '쉬움' : course.difficulty === 'medium' ? '보통' : '도전';

    card.innerHTML = `
      <div class="course-header">
        <div class="course-name">${['🥇','🥈','🥉'][index]} ${course.name}</div>
        <span class="course-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="course-desc">${course.desc}</div>
      <div class="course-stats">
        <div class="course-stat">📏 <strong>${course.distKm}km</strong></div>
        <div class="course-stat">⏱️ <strong>${course.timeMin}분</strong></div>
        <div class="course-stat">🔥 <strong>${course.calories}kcal</strong></div>
      </div>
      <div class="course-reason">${course.reason}</div>
    `;

    card.addEventListener('click', () => {
      document.querySelectorAll('.course-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      showCourseOnMap(course, index);
    });

    list.appendChild(card);
  });

  if (courses.length > 0) {
    list.children[0].classList.add('selected');
    showCourseOnMap(courses[0], 0);
  }
}
</script>
