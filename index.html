<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans KR', sans-serif; background: #f0f4f0; color: #2d3436; min-height: 100vh; }
  .header {
    background: linear-gradient(135deg, #00b894, #00cec9); color: white;
    padding: 20px 24px; text-align: center; box-shadow: 0 2px 12px rgba(0,184,148,0.3);

  /* 날씨 */

  .weather-info h3 { font-size: 0.85rem; color: #636e72; font-weight: 400; }

  .weather-desc { font-size: 0.85rem; color: #636e72; margin-top: 2px; }
  .weather-tags { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .weather-tag { background: #dfe6e9; color: #636e72; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }

  .location-input {
    flex: 1; padding: 10px 14px; border: 2px solid #dfe6e9; border-radius: 12px;
    font-size: 0.95rem; font-family: inherit; outline: none; transition: border-color 0.2s; min-width: 0;

  .location-input:focus { border-color: #00b894; }
  .location-btn {
    padding: 10px 16px; border: none; border-radius: 12px; font-size: 0.85rem;

  .btn-gps:hover { background: #00a381; }

<script>
// ===== 상태 관리 =====
let currentLat = null, currentLng = null, currentLocationName = '';
let map = null, routeLayer = null;
let selectedTime = 30, selectedPurpose = 'relax';
let cachedCafes = []; // 카페 데이터 캐시

// ===== 칩 선택 =====
document.querySelectorAll('#timeChips .pref-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#timeChips .pref-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedTime = parseInt(chip.dataset.value);
  });
});
document.querySelectorAll('#purposeChips .pref-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#purposeChips .pref-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedPurpose = chip.dataset.value;
  });
});

// ===== OSRM 도보 라우팅 =====
async function getWalkingRoute(waypoints) {
  const coords = waypoints.map(p => `${p[1]},${p[0]}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/foot/${coords}?overview=full&geometries=geojson&steps=true`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.code === 'Ok' && data.routes.length > 0) {
      const route = data.routes[0];
      const path = route.geometry.coordinates.map(c => [c[1], c[0]]);
      return { path, distanceKm: parseFloat((route.distance / 1000).toFixed(1)), durationMin: Math.round(route.duration / 60) };
    }
  } catch (e) { console.error('OSRM 오류:', e); }
  return null;
}

// ===== Overpass API - 카페 검색 =====
async function searchNearbyCafes(lat, lng, radiusMeters = 800) {
  const query = `[out:json][timeout:10];(node["amenity"="cafe"](around:${radiusMeters},${lat},${lng});node["cuisine"="coffee"](around:${radiusMeters},${lat},${lng}););out body 20;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(query) });
    const data = await res.json();
    return data.elements.map(el => ({
      lat: el.lat, lng: el.lon,
      name: el.tags.name || el.tags['name:ko'] || '카페',
      brand: el.tags.brand || '',
      opening: el.tags.opening_hours || ''
    }));
  } catch (e) { console.error('카페 검색 오류:', e); return []; }
}

// ===== Wikipedia API - 지역 지리/역사 정보 =====
async function fetchGeoInfo(lat, lng, locationName) {
  const results = [];

  // 1) Wikipedia Geosearch - 주변의 위키피디아 문서 검색
  try {
    const geoUrl = `https://ko.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${lat}|${lng}&gsradius=2000&gslimit=5&format=json&origin=*`;
    const geoRes = await fetch(geoUrl);
    const geoData = await geoRes.json();

    if (geoData.query && geoData.query.geosearch) {
      for (const item of geoData.query.geosearch.slice(0, 3)) {
        // 각 문서의 요약 가져오기
        try {
          const summaryUrl = `https://ko.wikipedia.org/w/api.php?action=query&pageids=${item.pageid}&prop=extracts&exintro=true&explaintext=true&exsentences=3&format=json&origin=*`;
          const summaryRes = await fetch(summaryUrl);
          const summaryData = await summaryRes.json();
          const page = summaryData.query.pages[item.pageid];
          if (page && page.extract && page.extract.length > 20) {
            results.push({
              title: page.title,
              extract: page.extract.substring(0, 200) + (page.extract.length > 200 ? '...' : ''),
              dist: item.dist,
              url: `https://ko.wikipedia.org/wiki/${encodeURIComponent(page.title)}`
            });
          }
        } catch (e) { /* skip */ }
      }
    }
  } catch (e) { console.error('위키피디아 Geosearch 오류:', e); }

  // 2) 지역명으로 직접 검색 (Geosearch로 못 찾은 경우 보완)
  if (results.length < 2) {
    try {
      const searchUrl = `https://ko.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(locationName + ' 지리 역사')}&srlimit=3&format=json&origin=*`;
      const searchRes = await fetch(searchUrl);
      const searchData = await searchRes.json();

      if (searchData.query && searchData.query.search) {
        for (const item of searchData.query.search) {
          if (results.find(r => r.title === item.title)) continue; // 중복 제거
          try {
            const summaryUrl = `https://ko.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(item.title)}&prop=extracts&exintro=true&explaintext=true&exsentences=3&format=json&origin=*`;
            const summaryRes = await fetch(summaryUrl);
            const summaryData = await summaryRes.json();
            const pages = summaryData.query.pages;
            const page = Object.values(pages)[0];
            if (page && page.extract && page.extract.length > 20) {
              results.push({
                title: page.title,
                extract: page.extract.substring(0, 200) + (page.extract.length > 200 ? '...' : ''),
                dist: null,
                url: `https://ko.wikipedia.org/wiki/${encodeURIComponent(page.title)}`
              });
            }
          } catch (e) { /* skip */ }
          if (results.length >= 4) break;
        }
      }
    } catch (e) { console.error('위키피디아 검색 오류:', e); }
  }

  return results;
}

// ===== 경유지 생성 =====
function generateWaypoints(lat, lng, radiusKm, numPoints, pattern) {
  const waypoints = [[lat, lng]];
  const latPerKm = 0.009, lngPerKm = 0.011;

  if (pattern === 'loop') {
    const startAngle = Math.random() * 2 * Math.PI;
    for (let i = 0; i < numPoints; i++) {
      const angle = startAngle + (2 * Math.PI * i) / numPoints;
      const r = radiusKm * (0.7 + Math.random() * 0.3);
      waypoints.push([lat + Math.sin(angle) * r * latPerKm, lng + Math.cos(angle) * r * lngPerKm]);
    }
    waypoints.push([lat, lng]);
  } else if (pattern === 'outAndBack') {
    const startAngle = Math.random() * 2 * Math.PI;
    const totalPoints = numPoints * 2;
    for (let i = 0; i < totalPoints; i++) {
      const angle = startAngle + (2 * Math.PI * i) / totalPoints;
      const progress = i / totalPoints;
      const r = radiusKm * (progress < 0.5 ? (0.5 + progress) : (1.5 - progress));
      const j = radiusKm * 0.15;
      waypoints.push([
        lat + Math.sin(angle) * r * latPerKm + (Math.random() - 0.5) * j * latPerKm,
        lng + Math.cos(angle) * r * lngPerKm + (Math.random() - 0.5) * j * lngPerKm
      ]);
    }
    waypoints.push([lat, lng]);
  } else {
    const points = [];
    for (let i = 0; i < numPoints; i++) {
      const angle = Math.random() * 2 * Math.PI;
      const dist = (0.3 + Math.random() * 0.7) * radiusKm;
      points.push({ lat: lat + Math.sin(angle) * dist * latPerKm, lng: lng + Math.cos(angle) * dist * lngPerKm, angle });
    }
    points.sort((a, b) => a.angle - b.angle);
    points.forEach(p => waypoints.push([p.lat, p.lng]));
    waypoints.push([lat, lng]);
  }
  return waypoints;
}

// ===== 위치 검색 =====
async function searchLocation() {
  const query = document.getElementById('locationInput').value.trim();
  if (!query) return alert('장소를 입력해주세요!');
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=kr&limit=1`);
    const data = await res.json();
    if (data.length === 0) { alert('장소를 찾을 수 없어요.'); return; }
    currentLat = parseFloat(data[0].lat);
    currentLng = parseFloat(data[0].lon);
    currentLocationName = query;
    updateWeather();
  } catch (e) { alert('검색 중 오류가 발생했어요.'); }
}

function getMyLocation() {
  if (!navigator.geolocation) { alert('GPS를 사용할 수 없어요.'); return; }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLng}`);
        const data = await res.json();
        const addr = data.address;
        currentLocationName = addr.borough || addr.suburb || addr.neighbourhood || addr.city || '내 위치';
        document.getElementById('locationInput').value = currentLocationName;
      } catch (e) { currentLocationName = '내 위치'; }
      updateWeather();
    },
    () => alert('위치 접근을 허용해주세요!')
  );
}

document.getElementById('locationInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchLocation(); });

// ===== 날씨 시뮬레이션 =====
function getSimulatedWeather() {
  const hour = new Date().getHours(), month = new Date().getMonth() + 1;
  let baseTemp;
  if (month >= 3 && month <= 5) baseTemp = 14 + Math.random() * 8;
  else if (month >= 6 && month <= 8) baseTemp = 25 + Math.random() * 8;
  else if (month >= 9 && month <= 11) baseTemp = 10 + Math.random() * 10;
  else baseTemp = -3 + Math.random() * 8;
  if (hour < 7 || hour > 20) baseTemp -= 3;
  if (hour >= 12 && hour <= 15) baseTemp += 2;
  const temp = Math.round(baseTemp);
  const humidity = 40 + Math.round(Math.random() * 40);
  const uvIndex = (hour >= 10 && hour <= 16) ? Math.round(Math.random() * 8 + 2) : Math.round(Math.random() * 3);
  const weathers = [
    { icon: '☀️', desc: '맑음', code: 'clear' }, { icon: '⛅', desc: '구름 조금', code: 'partly_cloudy' },
    { icon: '☁️', desc: '흐림', code: 'cloudy' }, { icon: '🌧️', desc: '가벼운 비', code: 'rain' },
    { icon: '🌤️', desc: '대체로 맑음', code: 'mostly_clear' },
  ];
  const w = weathers[Math.floor(Math.random() * weathers.length)];
  return { temp, humidity, uvIndex, windSpeed: Math.round(Math.random() * 15 + 2), pm25: Math.round(Math.random() * 80 + 10), ...w };
}

function updateWeather() {
  const weather = getSimulatedWeather();
  window.currentWeather = weather;
  document.getElementById('weatherCard').style.display = 'flex';
  document.getElementById('weatherIcon').textContent = weather.icon;
  document.getElementById('weatherLocation').textContent = currentLocationName;
  document.getElementById('weatherTemp').textContent = `${weather.temp}°`;
  document.getElementById('weatherDesc').textContent = weather.desc;
  const tags = [`습도 ${weather.humidity}%`, `바람 ${weather.windSpeed}m/s`, `자외선 ${weather.uvIndex}`, `미세먼지 ${weather.pm25 < 30 ? '좋음' : weather.pm25 < 50 ? '보통' : '나쁨'}`];
  document.getElementById('weatherTags').innerHTML = tags.map(t => `<span class="weather-tag">${t}</span>`).join('');
}

// ===== 코스 템플릿 =====

// ===== 메인: 코스 생성 =====
async function generateCourses() {
  if (!currentLat || !currentLng) { alert('먼저 위치를 검색하거나 GPS로 설정해주세요!'); return; }

  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');
  loading.classList.add('show');
  document.getElementById('coursesSection').style.display = 'none';
  document.getElementById('aiMessage').style.display = 'none';
  document.getElementById('geoPanel').style.display = 'none';
  document.getElementById('cafePanel').style.display = 'none';
  document.getElementById('generateBtn').disabled = true;

  const weather = window.currentWeather;
  const templates = getCourseTemplates();

  // 점수 매기기
  const scored = templates.map(course => {
    let score = 0;
    if (course.purpose.includes(selectedPurpose)) score += 30;
    score += Math.max(0, 25 - Math.abs(course.baseTime - selectedTime));
    if (weather.code === 'rain' && course.allWeather) score += 20;
    if (weather.code === 'rain' && !course.allWeather) score -= 15;
    if (weather.temp > 30 && course.allWeather) score += 10;
    if (weather.temp < 5 && course.allWeather) score += 10;
    if (weather.pm25 >= 50 && course.baseTime <= 30) score += 10;
    if (weather.pm25 >= 50 && course.baseTime > 45) score -= 10;
    score += Math.random() * 10;
    return { ...course, score };
  });
  scored.sort((a, b) => b.score - a.score);
  const topCourses = scored.slice(0, 3);

  // 병렬로 데이터 가져오기: 라우팅 + 카페 + 지리정보
  loadingText.textContent = '경로, 카페, 지리 정보를 가져오는 중...';

  // 1) 라우팅
  const routePromises = topCourses.map(async (course, i) => {
    const waypoints = generateWaypoints(currentLat, currentLng, course.radiusKm, course.numPoints, course.pattern);
    const routeData = await getWalkingRoute(waypoints);
    if (routeData) {
      return { ...course, routePath: routeData.path, distKm: routeData.distanceKm, timeMin: routeData.durationMin, calories: Math.round(routeData.distanceKm * 65), waypoints };
    }
    return { ...course, routePath: waypoints, distKm: course.baseDist, timeMin: course.baseTime, calories: course.baseCal, waypoints, fallback: true };
  });

  // 2) 카페 (카페 모드일 때)
  const cafePromise = selectedPurpose === 'cafe' ? searchNearbyCafes(currentLat, currentLng, 800) : Promise.resolve([]);

  // 3) 지리 정보 (항상)
  const geoPromise = fetchGeoInfo(currentLat, currentLng, currentLocationName);

  // 모두 대기
  const [coursesWithRoutes, nearbyCafes, geoInfo] = await Promise.all([
    Promise.all(routePromises),
    cafePromise,
    geoPromise
  ]);

  cachedCafes = nearbyCafes;
  coursesWithRoutes.forEach(c => { c.nearbyCafes = nearbyCafes; });

  loading.classList.remove('show');
  document.getElementById('generateBtn').disabled = false;

  // AI 메시지
  let msg = `<strong>🤖 AI 분석 결과</strong><br>`;
  msg += `현재 ${currentLocationName}은(는) ${weather.desc}, ${weather.temp}°C 입니다. `;
  if (weather.code === 'rain') msg += `비가 오고 있어서 실내 경유 코스 위주로 추천했어요. `;
  else if (weather.temp > 30) msg += `더운 날씨라 그늘이 많은 코스를 우선 추천했어요. `;
  else if (weather.temp < 5) msg += `추운 날씨라 따뜻한 카페를 경유하는 코스를 포함했어요. `;
  else msg += `산책하기 좋은 날씨네요! `;
  if (weather.pm25 >= 50) msg += `미세먼지가 높으니 마스크 착용을 권장해요.`;
  else if (weather.uvIndex >= 6) msg += `자외선이 강하니 모자나 선크림을 챙기세요!`;
  else msg += `실제 도로를 기반으로 경로를 계산했어요. 🌿`;

  document.getElementById('aiMessage').innerHTML = msg;
  document.getElementById('aiMessage').style.display = 'block';

  // 지리 정보 표시
  renderGeoPanel(geoInfo);

  // 카페 목록 표시
  if (selectedPurpose === 'cafe' && nearbyCafes.length > 0) renderCafePanel(nearbyCafes);

  showMap();
  renderCourses(coursesWithRoutes);
}

// ===== 지리 정보 패널 렌더링 =====
function renderGeoPanel(geoInfo) {
  const panel = document.getElementById('geoPanel');
  const content = document.getElementById('geoContent');

  if (!geoInfo || geoInfo.length === 0) {
    panel.style.display = 'none';
    return;
  }

  content.innerHTML = geoInfo.map(item => `
    <div class="geo-item">
      <div class="geo-item-title"><a href="${item.url}" target="_blank">${item.title}</a></div>
      <div class="geo-item-desc">${item.extract}</div>
      ${item.dist ? `<div class="geo-item-dist">📍 현재 위치에서 약 ${item.dist < 1000 ? Math.round(item.dist) + 'm' : (item.dist/1000).toFixed(1) + 'km'}</div>` : ''}
    </div>
  `).join('');

  panel.style.display = 'block';
  panel.classList.add('fade-in');
}

// ===== 카페 목록 패널 렌더링 =====
function renderCafePanel(cafes) {
  const panel = document.getElementById('cafePanel');
  const list = document.getElementById('cafeList');

  list.innerHTML = cafes.map((cafe, i) => `
    <div class="cafe-list-item" onclick="focusCafeOnMap(${i})">
      <div class="cafe-list-icon">☕</div>
      <div class="cafe-list-info">
        <div class="cafe-list-name">${cafe.name}</div>
        <div class="cafe-list-detail">${cafe.brand ? cafe.brand + ' · ' : ''}${cafe.opening || '영업시간 미등록'}</div>
      </div>
    </div>
  `).join('');

  panel.style.display = 'block';
  panel.classList.add('fade-in');
}

function focusCafeOnMap(index) {
  if (!map || !cachedCafes[index]) return;
  const cafe = cachedCafes[index];
  map.setView([cafe.lat, cafe.lng], 17);
  // 해당 카페의 마커를 찾아서 팝업 열기
  routeLayer.eachLayer(layer => {
    if (layer.getLatLng && Math.abs(layer.getLatLng().lat - cafe.lat) < 0.0001 && Math.abs(layer.getLatLng().lng - cafe.lng) < 0.0001) {
      layer.openPopup();
    }
  });
}

// ===== 지도 =====
function showMap() {
  document.getElementById('mapContainer').style.display = 'block';
  if (!map) {
    map = L.map('map').setView([currentLat, currentLng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
  } else { map.setView([currentLat, currentLng], 15); }
  if (routeLayer) map.removeLayer(routeLayer);
  routeLayer = L.layerGroup().addTo(map);
  L.marker([currentLat, currentLng]).addTo(routeLayer).bindPopup(`📍 ${currentLocationName}`).openPopup();
}

function showCourseOnMap(course, index) {
  if (!map || !routeLayer) return;
  routeLayer.clearLayers();

  const colors = ['#00b894', '#0984e3', '#e17055'];
  const color = colors[index] || '#00b894';

  // 출발 마커
  const startIcon = L.divIcon({
    html: `<div style="background:${color};color:white;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);">S</div>`,
    className: '', iconSize: [32, 32], iconAnchor: [16, 16]
  });
  L.marker([currentLat, currentLng], { icon: startIcon }).addTo(routeLayer).bindPopup(`📍 출발/도착: ${currentLocationName}`);

  if (course.routePath && course.routePath.length > 1) {
    // 경로 (테두리 + 색상)
    L.polyline(course.routePath, { color: 'white', weight: 9, opacity: 0.8, lineJoin: 'round', lineCap: 'round' }).addTo(routeLayer);
    const routeLine = L.polyline(course.routePath, { color: color, weight: 5, opacity: 0.9, lineJoin: 'round', lineCap: 'round' }).addTo(routeLayer);

    // 화살표
    L.polylineDecorator(routeLine, {
      patterns: [{ offset: '5%', repeat: 80, symbol: L.Symbol.arrowHead({ pixelSize: 12, polygon: true, pathOptions: { color: color, fillColor: color, fillOpacity: 1, weight: 1 } }) }]
    }).addTo(routeLayer);

    // 경유지
    if (course.waypoints) {
      let num = 1;
      course.waypoints.forEach((point, i) => {
        if (i === 0 || i === course.waypoints.length - 1) return;
        const wpIcon = L.divIcon({
          html: `<div style="background:white;color:${color};border:2px solid ${color};border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;box-shadow:0 1px 4px rgba(0,0,0,0.2);">${num}</div>`,
          className: '', iconSize: [22, 22], iconAnchor: [11, 11]
        });
        L.marker(point, { icon: wpIcon }).addTo(routeLayer).bindPopup(`📌 경유지 ${num}`);
        num++;
      });
    }

    // ☕ 카페 마커 (크고 눈에 띄는 디자인)
    if (course.nearbyCafes && course.nearbyCafes.length > 0) {
      course.nearbyCafes.forEach((cafe, ci) => {
        const cafeIcon = L.divIcon({
          html: `<div style="
            background: linear-gradient(135deg, #e17055, #d63031);
            color: white; border-radius: 12px; padding: 4px 10px;
            font-size: 12px; font-weight: 700; white-space: nowrap;
            box-shadow: 0 3px 10px rgba(214,48,49,0.4);
            display: flex; align-items: center; gap: 4px;
            border: 2px solid white;
            animation: cafePulse 2s ease-in-out infinite;
            animation-delay: ${ci * 0.2}s;
          ">☕ ${cafe.name.length > 8 ? cafe.name.substring(0, 8) + '..' : cafe.name}</div>`,
          className: '', iconAnchor: [14, 14]
        });
        let popup = `<div style="min-width:140px"><strong style="font-size:14px;">☕ ${cafe.name}</strong>`;
        if (cafe.brand) popup += `<br><span style="color:#636e72;font-size:12px;">${cafe.brand}</span>`;
        if (cafe.opening) popup += `<br><span style="color:#636e72;font-size:12px;">🕐 ${cafe.opening}</span>`;
        popup += '</div>';
        L.marker([cafe.lat, cafe.lng], { icon: cafeIcon, zIndexOffset: 1000 }).addTo(routeLayer).bindPopup(popup);
      });
    }

    map.fitBounds(course.routePath, { padding: [40, 40] });
  }
}

// ===== 코스 카드 =====
function renderCourses(courses) {
  const section = document.getElementById('coursesSection');
  const list = document.getElementById('coursesList');
  section.style.display = 'block';
  list.innerHTML = '';

  courses.forEach((course, index) => {
    const card = document.createElement('div');
    card.className = 'course-card fade-in';
    card.style.animationDelay = `${index * 0.15}s`;
    const badgeClass = course.difficulty === 'easy' ? 'badge-easy' : course.difficulty === 'medium' ? 'badge-medium' : 'badge-hard';
    const badgeText = course.difficulty === 'easy' ? '쉬움' : course.difficulty === 'medium' ? '보통' : '도전';

    card.innerHTML = `
      <div class="course-header">
        <div class="course-name">${['🥇','🥈','🥉'][index]} ${course.name}</div>
        <span class="course-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="course-desc">${course.desc}</div>
      <div class="course-stats">
        <div class="course-stat">📏 <strong>${course.distKm}km</strong></div>
        <div class="course-stat">⏱️ <strong>${course.timeMin}분</strong></div>
        <div class="course-stat">🔥 <strong>${course.calories}kcal</strong></div>
      </div>
      <div class="course-reason">${course.reason}</div>
    `;
    card.addEventListener('click', () => {
      document.querySelectorAll('.course-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      showCourseOnMap(course, index);
    });
    list.appendChild(card);
  });

  if (courses.length > 0) {
    list.children[0].classList.add('selected');
    showCourseOnMap(courses[0], 0);
  }
}
</script>
